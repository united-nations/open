# NOTE: 
# - static_site_generator: next has been removed to manage basePath manually in next.config.ts

# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    env:
      SITE_VARIANT: public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-public-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', 'config/features.json') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-public-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Match the actual Pages URL, including /open on github.io.
      - name: Configure deployment path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "BASE_PATH=$PAGES_BASE_PATH" >> "$GITHUB_ENV"
          echo "PORTAL_URL=http://127.0.0.1:8766$PAGES_BASE_PATH" >> "$GITHUB_ENV"
      - name: Build with Next.js
        run: pnpm build
      - name: Verify feature availability
        run: |
          node --test src/lib/tests/featureProfiles.test.mjs
          node scripts/check-feature-export.mjs
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify public page and downloads in browser
        run: |
          # Mount the export under its deployment path, as Pages does.
          static_root="$RUNNER_TEMP/portal-static"
          mkdir -p "$static_root$(dirname "${BASE_PATH:-/}")"
          if [ -n "${BASE_PATH:-}" ]; then
            ln -s "$PWD/out" "$static_root$BASE_PATH"
          else
            static_root="$PWD/out"
          fi
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$static_root" > /tmp/portal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/browser/feature-profiles.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
