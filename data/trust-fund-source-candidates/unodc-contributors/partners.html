         <h1 class="site-heading">UNODC Open Data for Partnerships and Funding</h1>
      </div>
   </div>
</div><div class="container mx-auto mt-0">
   <div class=" row my-4">
      <div style="" class=" col-lg-12"><p>UNODC is committed to provide our partners information on their contributions in a transparent manner. A new data-driven dashboard titled “UNODC Open Data for Partnerships and Funding” with interactive visualizations for an effective understanding of UNODC partner’s contributions allows to explore information on the voluntary contribution by fund types, thematic areas and geographical focus. This is our first publicly accessible dashboard that provides up-to-date indicative pledge-based information reflecting pledges received during the calendar year.</p>
To get started, click on the image below and try searching for donors, projects or thematic areas in a subject area of your interest. 2024 data is presented in a static format since the dashboard is currently under review and will be updated during the course of 2025.  We hope you will find UNODC Open Data for Partnerships and Funding useful and informative.</div>
   </div>
</div><div class="container mx-auto mt-0">
   <div class=" row">
      <div style="" class=" col-lg-3">

</div><div class="container mx-auto mt-0">
   <div class=" row">
      <div style="" class=" col-lg-12"><p> </p>
<p>For suggestions to improve the UNODC Open Data for Partnerships and Funding, please email us at cps@un.org.</p>
<p>This site provides indicative pledge-based information derived from a variety of UNODC partners.</p>
