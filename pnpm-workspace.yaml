# pnpm 11 defaults to strictDepBuilds, which errors on unrun build scripts.
# Both packages ship prebuilt binaries for this platform (@img/sharp-linux-x64,
# napi prebuilds), so their install scripts are only a check plus a
# build-from-source fallback we don't need.
allowBuilds:
  sharp: false
  unrs-resolver: false
overrides:
  # @undp/data-viz uses this optional dependency only for XLSX downloads, which
  # Open does not use. Its direct CDN tarball is blocked by pnpm 11's default
  # blockExoticSubdeps protection, so omit only this unused optional edge.
  '@undp/data-viz@2.2.3>xlsx': '-'
